name: Build the flutter version of the RustDesk

on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "1.5.3-dual-std"
      publish-update-metadata:
        type: boolean
        default: false
      corp-name:
        type: string
        default: "RustDesk_Unified"
      corp-display:
        type: string
        default: "RustDesk Unified"
      corp-mode:
        type: string
        default: "standard"
# NOTE: F-Droid builder script 'flutter/build_fdroid.sh' reads environment
# variables from this workflow!
#
# It does NOT read build steps, however, so please fix 'flutter/build_fdroid.sh
# whenever you add changes to Android CI build action ('build-rustdesk-android')
# in this file!

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform except macOS arm64 (below) stays on FLUTTER_VERSION
  # (3.24.5) until Windows 7 support is restored after the upstream-wide Flutter bump. The 3.44
  # jobs patch the few 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources
  # for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # macOS arm64 only: 3.24.5's engine crashes in attributedSubstringForProposedRange
  # (https://github.com/rustdesk/rustdesk/issues/16817, https://github.com/flutter/flutter/issues/153157).
  # x86_64 stays on FLUTTER_VERSION: 3.44's FlutterMacOS needs macOS 10.15 there, and it targets 10.14.
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.3"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  PUBLISH_UPDATE_METADATA: "${{ inputs.publish-update-metadata }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"

jobs:

  validate-update-metadata-keys:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        if: ${{ inputs.publish-update-metadata }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python
        if: ${{ inputs.publish-update-metadata }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: ${{ inputs.publish-update-metadata }}
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Test update metadata signer
        if: ${{ inputs.publish-update-metadata }}
        run: |
          python -m unittest \
            res/update/test_generate_update_metadata.py \
            res/update/test_update_metadata_cli.py \
            res/update/test_macos_update_scripts.py

      - name: Validate update metadata keys
        if: ${{ inputs.publish-update-metadata }}
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: python res/update/generate_update_metadata.py check-key

  generate-bridge:
    needs: [validate-update-metadata-keys]
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    needs: [validate-update-metadata-keys]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: windows-2022,
              platform: x64,
            }
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Inject corporate dual-net config
        shell: bash
        env:
          CORP_NAME: ${{ inputs.corp-name }}
          CORP_DISPLAY: ${{ inputs.corp-display }}
          CORP_MODE: ${{ inputs.corp-mode }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Inject dual-network corp config + custom product name into RustDesk 1.5.3.
          
          ONE exe contains BOTH parameter sets plus ONE shared auto-probe rule:
            * auto (default)  -> probe 192.168.91.24 first, fall back to 192.168.91.23
                                 only when .24 is unreachable. Every machine runs the
                                 same rule, so they all land on the same server and the
                                 address book is unified with ZERO manual switching.
            * RUSTDESK_NET=office / =mes -> force a network (transition escape hatch)
          
          Implementation: Config::get_option() resolves through
              get_or(&OVERWRITE_SETTINGS, &CONFIG2.options, &DEFAULT_SETTINGS, k)
          so initialising the OVERWRITE_SETTINGS lazy_static from corp_net_settings()
          covers custom-rendezvous-server / key / relay-server / api-server in one shot.
          No const replacements needed at runtime, no startup-order race, and the
          settings page fields become read-only (is_option_can_save short-circuits).
          
          Compile-time constants are still set to the .24 set as a belt-and-braces
          fallback (RENDEZVOUS_SERVERS / RS_PUB_KEY / admin.rustdesk.com).
          
          Changes:
            * libs/hbb_common/src/config.rs : constants, OVERWRITE_SETTINGS, corp_net_settings(),
                                              APP_NAME, HARD_SETTINGS, update defaults
            * src/common.rs                 : corporate API fallback
            * flutter/lib/desktop/widgets/tabbar_widget.dart : custom title-bar text
            * flutter/windows/runner/main.cpp                : fallback app name
            * flutter/windows/runner/Runner.rc               : ProductName / FileDescription
          """
          import os
          import sys
          
          # Windows runners default stdout to cp1252/charmap. Printing a Chinese
          # product name raises UnicodeEncodeError even though the file edits succeed.
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          
          HOST_MAIN = "192.168.91.24"
          KEY_MAIN = "nJJlHIsuvoqeOcAGXyAM410jVzH4LaRedxf1vGEU3aU="
          API_MAIN = "http://192.168.91.24:21114"
          HOST_ALT = "192.168.91.23"
          KEY_ALT = "lLN4ihwkY06nE84yeJxr9GpfdnSuexIn1VrkVyc09qQ="
          API_ALT = "http://192.168.91.23:21114"
          
          name = os.environ["CORP_NAME"]
          disp = os.environ["CORP_DISPLAY"]
          mode = os.environ["CORP_MODE"]
          
          assert mode in ("lite", "standard"), mode
          assert name and not any(ch in name for ch in '\\/:*?"<>|\r\n'), name
          assert disp.isascii() and '"' not in disp and '\\' not in disp, disp
          assert name != "RustDesk" and disp != "RustDesk"
          
          ROOT = os.environ.get("CORP_SRC", ".")
          
          
          def path(p):
              return os.path.join(ROOT, p)
          
          
          # ---------------------------------------------------------------- config.rs
          cfgp = path("libs/hbb_common/src/config.rs")
          s = open(cfgp, encoding="utf-8").read()
          
          
          def rep_all(old, new, minimum=1):
              global s
              n = s.count(old)
              assert n >= minimum, "expected >=%d of %r, got %d" % (minimum, old[:60], n)
              s = s.replace(old, new)
          
          
          def rep_one(old, new):
              global s
              n = s.count(old)
              assert n == 1, "expected exactly 1 of %r, got %d" % (old[:70], n)
              s = s.replace(old, new, 1)
          
          
          # 1. compile-time fallback constants -> unified (.24) network
          rep_all("rs-ny.rustdesk.com", HOST_MAIN)
          rep_one("OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=", KEY_MAIN)
          
          # 2. APP_NAME -> custom name (native window title + is_custom_client())
          rep_one('RwLock::new("RustDesk".to_owned())',
                  'RwLock::new("' + name + '".to_owned())')
          
          # 3. OVERWRITE_SETTINGS: the single injection point that carries BOTH sets.
          CORP_FN = '''pub const CORP_HOST_MAIN: &str = "%s";
          pub const CORP_KEY_MAIN: &str = "%s";
          pub const CORP_API_MAIN: &str = "%s";
          pub const CORP_HOST_ALT: &str = "%s";
          pub const CORP_KEY_ALT: &str = "%s";
          pub const CORP_API_ALT: &str = "%s";
          
          /// One binary, two in-house networks, ONE shared auto-probe rule.
          /// Every machine (control side AND controlled side) runs this same rule, so
          /// they all land on the same server: prefer 192.168.91.24; fall back to
          /// 192.168.91.23 only when .24 is unreachable. The result is an automatically
          /// unified address book - the user never picks a network and never switches.
          /// RUSTDESK_NET=office / =mes forces a choice (transition-period escape hatch).
          fn corp_server_reachable(host: &str) -> bool {
              use std::net::{SocketAddr, TcpStream};
              use std::time::Duration;
              let addr: SocketAddr = match format!("{}:{}", host, 21116).parse() {
                  Ok(a) => a,
                  Err(_) => return false,
              };
              TcpStream::connect_timeout(&addr, Duration::from_millis(400)).is_ok()
          }
          
          pub fn corp_net_settings() -> HashMap<String, String> {
              let forced = std::env::var("RUSTDESK_NET").unwrap_or_default();
              let mes = if forced.eq_ignore_ascii_case("mes") {
                  true
              } else if forced.eq_ignore_ascii_case("office") {
                  false
              } else if corp_server_reachable(CORP_HOST_MAIN)
                  || corp_server_reachable(CORP_HOST_MAIN) {
                  false
              } else if corp_server_reachable(CORP_HOST_ALT) {
                  true
              } else {
                  false
              };
              let (host, key, api) = if mes {
                  (CORP_HOST_ALT, CORP_KEY_ALT, CORP_API_ALT)
              } else {
                  (CORP_HOST_MAIN, CORP_KEY_MAIN, CORP_API_MAIN)
              };
              let mut m: HashMap<String, String> = HashMap::new();
              m.insert("custom-rendezvous-server".to_owned(), host.to_owned());
              m.insert("key".to_owned(), key.to_owned());
              m.insert("relay-server".to_owned(), host.to_owned());
              m.insert("api-server".to_owned(), api.to_owned());
              m
          }
          ''' % (HOST_MAIN, KEY_MAIN, API_MAIN, HOST_ALT, KEY_ALT, API_ALT)
          
          rep_one('pub const RENDEZVOUS_PORT: i32 = 21116;',
                  CORP_FN + 'pub const RENDEZVOUS_PORT: i32 = 21116;')
          rep_one('    pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = Default::default();',
                  '    pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = RwLock::new(corp_net_settings());')
          
          # 4. HARD_SETTINGS
          #    lite     : official incoming-only SOS mini window + hide settings/ab/account
          #    standard : full client, portable-only (no install page / no --install)
          hard = []
          if mode == "lite":
              hard += ['m.insert("conn-type".to_string(), "incoming".to_string());',
                       'm.insert("disable-settings".to_string(), "Y".to_string());',
                       'm.insert("disable-ab".to_string(), "Y".to_string());',
                       'm.insert("disable-account".to_string(), "Y".to_string());']
          hard += ['m.insert("disable-installation".to_string(), "Y".to_string());']
          hard_block = (
              '    pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = {\n'
              '        let mut m = std::collections::HashMap::new();\n'
              + '\n'.join('        ' + h for h in hard) + '\n'
              '        RwLock::new(m)\n'
              '    };')
          rep_one('    pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = Default::default();',
                  hard_block)
          
          # 5. Belt-and-braces: kill check-update / auto-update / help cards in both
          #    LocalConfig (read by check_software_update) and Config2 (read by Flutter).
          DEFAULTS = '''        for (k, v) in [
                      ("enable-check-update", "N"),
                      ("allow-auto-update", "N"),
                      ("hide-help-cards", "Y"),
                      ("hide-powered-by-me", "Y"),
                  ] {
                      if !config.options.contains_key(k) {
                          config.options.insert(k.to_string(), v.to_string());
                          store = true;
                      }
                  }
          '''
          rep_one('''    fn load() -> LocalConfig {
                  Config::load_::<LocalConfig>("_local")
              }''', '''    fn load() -> LocalConfig {
                  let mut config = Config::load_::<LocalConfig>("_local");
                  let mut store = false;
          ''' + DEFAULTS + '''        if store { config.store(); }
                  config
              }''')
          rep_one('''    fn load() -> Config2 {
                  let mut config = Config::load_::<Config2>("2");
                  let mut store = false;''', '''    fn load() -> Config2 {
                  let mut config = Config::load_::<Config2>("2");
                  let mut store = false;
          ''' + DEFAULTS)
          open(cfgp, "w", encoding="utf-8").write(s)
          
          # ---------------------------------------------------------------- common.rs
          cp = path("src/common.rs")
          t = open(cp, encoding="utf-8").read()
          assert t.count("https://admin.rustdesk.com") >= 1
          open(cp, "w", encoding="utf-8").write(
              t.replace("https://admin.rustdesk.com", API_MAIN))
          
          # -------------------------------------------- Flutter custom title-bar text
          tbp = path("flutter/lib/desktop/widgets/tabbar_widget.dart")
          u = open(tbp, encoding="utf-8").read()
          assert u.count('"RustDesk"') == 1, u.count('"RustDesk"')
          open(tbp, "w", encoding="utf-8").write(u.replace('"RustDesk"', '"' + name + '"', 1))
          
          # ------------------------------------------- native window-title fallback
          mcp = path("flutter/windows/runner/main.cpp")
          v = open(mcp, encoding="utf-8").read()
          assert v.count('std::wstring app_name = L"RustDesk";') == 1
          open(mcp, "w", encoding="utf-8").write(
              v.replace('std::wstring app_name = L"RustDesk";',
                        'std::wstring app_name = L"' + disp + '";', 1))
          
          # ------------------------------------------- PE version resource (ASCII only)
          rcp = path("flutter/windows/runner/Runner.rc")
          r = open(rcp, encoding="utf-8").read()
          assert r.count('VALUE "ProductName", "RustDesk" "\\0"') == 1
          assert r.count('VALUE "FileDescription", "RustDesk Remote Desktop" "\\0"') == 1
          r = r.replace('VALUE "ProductName", "RustDesk" "\\0"',
                        'VALUE "ProductName", "' + disp + '" "\\0"', 1)
          r = r.replace('VALUE "FileDescription", "RustDesk Remote Desktop" "\\0"',
                        'VALUE "FileDescription", "' + disp + ' Remote Desktop" "\\0"', 1)
          open(rcp, "w", encoding="utf-8").write(r)
          
          # ------------------------------------------------------------------ verify
          print("CORP mode         =", mode)
          print("CORP name         =", ascii(name))
          print("CORP display      =", disp)
          print("NET auto primary  =", HOST_MAIN, "key", KEY_MAIN[:8] + "...")
          print("NET auto fallback =", HOST_ALT, "key", KEY_ALT[:8] + "...")
          print("both sets in binary:", all(x in s for x in (HOST_MAIN, HOST_ALT, KEY_MAIN, KEY_ALT, API_MAIN, API_ALT)))
          print("OVERWRITE_SETTINGS:", 'RwLock::new(corp_net_settings())' in s)
          print("auto-probe gate   :", 'corp_server_reachable' in s and 'connect_timeout' in s)
          print("forced net gate   :", 'eq_ignore_ascii_case("mes")' in s and 'eq_ignore_ascii_case("office")' in s)
          for line in s.splitlines():
              if "pub const RENDEZVOUS_SERVERS" in line or "pub static ref APP_NAME" in line:
                  print("  " + ascii(line.strip()))
          print("  conn-type=incoming   :", '"conn-type".to_string(), "incoming"' in s)
          print("  disable-installation :", '"disable-installation".to_string(), "Y"' in s)
          print("  update defaults      :", s.count('"enable-check-update", "N"'))
          print("  admin.rustdesk.com   :", t.count("https://admin.rustdesk.com"), "-> replaced")
          print("  tabbar RustDesk left :", u.count('"RustDesk"'), "-> replaced")
          print("  Runner.rc ProductName:", disp)
          PY
      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Install LLVM and Clang
        id: llvm_action
        continue-on-error: true
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}
      - name: LLVM fallback (retry-hardened)
        if: steps.llvm_action.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fetch-WithRetry($url, $out, $minBytes) {
            $urls = @($url, "https://ghfast.top/$url", "https://gh-proxy.com/$url", "https://ghproxy.net/$url")
            foreach ($u in $urls) {
              for ($i = 1; $i -le 5; $i++) {
                Write-Host "fetch try $i : $u"
                & curl.exe -L --fail --silent --show-error --retry 3 --retry-all-errors `
                  --retry-delay 5 --connect-timeout 30 --max-time 900 -o $out $u
                if ($LASTEXITCODE -eq 0 -and (Test-Path $out) -and ((Get-Item $out).Length -ge $minBytes)) {
                  Write-Host "fetch OK ($([int]((Get-Item $out).Length / 1MB)) MB)"
                  return $true
                }
                Start-Sleep -Seconds 6
              }
            }
            return $false
          }
          $ver = $env:LLVM_VERSION
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-win64.exe"
          $tmp = "$env:RUNNER_TEMP\LLVM-$ver-win64.exe"
          if (-not (Fetch-WithRetry $url $tmp 100MB)) { throw "LLVM download failed on all mirrors" }
          New-Item -ItemType Directory -Force -Path 'C:\Program Files\LLVM' | Out-Null
          & "C:\ProgramData\Chocolatey\bin\7z.exe" x $tmp "-oC:\Program Files\LLVM" -y
          if ($LASTEXITCODE -ne 0) { throw "LLVM extract failed" }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin'
          Add-Content -Path $env:GITHUB_ENV -Value 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
          & 'C:\Program Files\LLVM\bin\clang.exe' --version

      - name: Install flutter
        id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      - name: Force arm64 Dart SDK + engine
        # The x64 SDK subosito installs bundles an x64 Dart with a matching engine-dart-sdk.stamp,
        # so update_dart_sdk.ps1 short-circuits (stamp matches -> return) and keeps x64 Dart;
        # `flutter build windows` then targets the Dart VM's arch = x64, even on this arm64 host.
        # On this native-arm64 runner (PROCESSOR_ARCHITECTURE=ARM64), deleting the stamp and
        # re-running update_dart_sdk.ps1 pulls the arm64 Dart (available since Flutter 3.44.0).
        # https://github.com/flutter/flutter/issues/186730#issuecomment-4573214964
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: |
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Flutter root: $flutterRoot"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          # Confirm the Dart we ended up with is arm64 ("on windows_arm64"); fail loudly if not.
          $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVer
          if ($dartVer -notmatch "windows_arm64") {
            Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
            exit 1
          }
          & "$flutterRoot\bin\flutter.bat" precache --windows
          # Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should
          # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.
          $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
          Write-Host "Engine artifacts present:"
          Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
          if (-not (Test-Path "$engineDir\windows-arm64-release")) {
            Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
            exit 1
          }

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
      - name: Replace engine with rustdesk custom flutter engine
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $url = 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip'
          $urls = @($url, "https://ghfast.top/$url", "https://gh-proxy.com/$url", "https://ghproxy.net/$url")
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 5; $i++) {
              Write-Host "engine fetch try $i : $u"
              & curl.exe -L --fail --silent --show-error --retry 3 --retry-all-errors `
                --retry-delay 5 --connect-timeout 30 --max-time 900 -o windows-x64-release.zip $u
              if ($LASTEXITCODE -eq 0 -and (Test-Path windows-x64-release.zip) -and ((Get-Item windows-x64-release.zip).Length -ge 10MB)) {
                $ok = $true; break
              }
              Start-Sleep -Seconds 6
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "engine zip download failed on all mirrors" }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release -Force
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
      - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # arm64 is on Flutter 3.44 (as is macOS arm64); apply its source/pubspec deltas on the fly
        # (shared with the macOS arm64 build and the 3.44 bridge job) so the committed sources
        # stay on Flutter 3.24.5.
        # `flutter build` then runs `pub get`, regenerating pubspec.lock for the bumped deps.
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        id: vcpkg_action
        continue-on-error: true
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: vcpkg fallback (retry-hardened)
        if: steps.vcpkg_action.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fetch-WithRetry($url, $out, $minBytes) {
            $urls = @($url, "https://ghfast.top/$url", "https://gh-proxy.com/$url", "https://ghproxy.net/$url")
            foreach ($u in $urls) {
              for ($i = 1; $i -le 5; $i++) {
                Write-Host "fetch try $i : $u"
                & curl.exe -L --fail --silent --show-error --retry 3 --retry-all-errors `
                  --retry-delay 5 --connect-timeout 30 --max-time 900 -o $out $u
                if ($LASTEXITCODE -eq 0 -and (Test-Path $out) -and ((Get-Item $out).Length -ge $minBytes)) { return $true }
                Start-Sleep -Seconds 6
              }
            }
            return $false
          }
          # run-vcpkg already cloned the repo into C:\vcpkg; it only failed while
          # bootstrap-vcpkg.bat tried to fetch vcpkg.exe. Just supply the binary.
          $root = 'C:\vcpkg'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $url = 'https://github.com/microsoft/vcpkg-tool/releases/download/2026-07-27/vcpkg.exe'
          $tmp = "$env:RUNNER_TEMP\vcpkg-tool.exe"
          if (-not (Fetch-WithRetry $url $tmp 1MB)) { throw "vcpkg.exe download failed on all mirrors" }
          Copy-Item $tmp "$root\vcpkg.exe" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
          & "$root\vcpkg.exe" version
      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one
        # (only for arm64 — leaving it unset lets x64 use the crate's bundled lib).
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: Run the Rust tests
        # x86_64 only: the tests are the same code on arm64, and that runner is the slow one.
        if: ${{ !inputs.upload-artifact && matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          # The build's own features, so the tests see the code that ships.
          FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }} --print-features)
          cargo test --locked --release --lib --features "$FEATURES"
          # Its Windows tests run nowhere else.
          cargo test --locked --release -p clipboard

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.upload-artifact }}
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
          path: "./rustdesk"

      - name: Upload unsigned
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
          path: rustdesk

      - name: Sign rustdesk files
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

      - name: Verify Windows Flutter version
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true'
        shell: powershell
        run: |
          $reportedVersion = (& ".\rustdesk\rustdesk.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "rustdesk --version exited with $LASTEXITCODE"
          }
          if ($reportedVersion -cne $env:VERSION) {
            throw "RustDesk reports version '$reportedVersion', expected '$env:VERSION'"
          }

      - name: Verify template payload signatures
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: powershell
        run: |
          Get-ChildItem ./rustdesk -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Extension -eq '.exe' -or ($_.Extension -eq '.dll' -and $_.FullName -notmatch 'RustDeskPrinterDriver|usbmmidd_v2') } |
            ForEach-Object {
              $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName -ErrorAction Stop
              if ($signature.Status -ne 'Valid') { throw "Invalid template payload signature: $($_.FullName) ($($signature.Status))" }
            }

      - name: Build template packer
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -e rustdesk.exe -l 11 -t "${{ matrix.job.target }}" --exclude-exe
          popd
          mkdir -p ./packer-template
          cp ./target/${{ matrix.job.target }}/release/rustdesk-portable-packer.exe ./packer-template/rustdesk-template-${{ matrix.job.arch }}.exe

      - name: Upload unsigned template packer
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-packer-template-${{ matrix.job.arch }}
          path: ./packer-template
          if-no-files-found: error

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          # Select the MSBuild process architecture; -p:Platform sets the MSI target.
          # Native ARM64 tools give the compiler more address space for PCH files
          # (C3859/C1076 were reported by HostX86\arm64\CL.exe).
          # Keep the action's default x86 MSBuild for the existing x64 MSI job.
          msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}

      - name: Build msi
        # Builds the MSI for the matrix arch. res/msi (WiX v4 + native CustomActions) carries
        # both x64 and ARM64 platform configs; WcaUtil/DUtil ship arm64 libs. msbuild platform
        # is x64 / ARM64; the produced Package.msi is globbed since its bin/<platform>/ dir varies.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
          sha256sum ../../SignOutput/rustdesk-*.msi

      - name: Build pre-built MSI template
        # Two things this works around: preprocess.py rewrites res/msi in place, so the
        # tree is reset around this second variant; and it locates the app as
        # <app-name>.exe inside the dist, so the dist copy is renamed to match.
        #
        # The placeholder is chosen to keep this template as close to the shipped msi as
        # possible: eight characters like "RustDesk", and a valid 8.3 name, so WiX
        # derives no short name for it. A longer placeholder would get one, and a patch
        # cannot rewrite a truncated placeholder, leaving short names pointing at it.
        #
        # It still has to be unique, which is why "RustDesk" itself cannot be used:
        # it also names payload that must never be renamed, such as librustdesk.dll
        # and drivers\RustDeskPrinterDriver.
        #
        #
        # Building the arm64 template on the native arm64 runner makes the ARM
        # package available: the build agents are x64 and cannot run
        # preprocess.py against an ARM exe.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          git checkout -- res/msi
          cp -r ./rustdesk ./rustdesk-msi-template
          mv ./rustdesk-msi-template/rustdesk.exe ./rustdesk-msi-template/RDAPPNAM.exe
          Set-Content -Path ./rustdesk-msi-template/custom.txt -Value 'placeholder' -NoNewline
          $assets = './rustdesk-msi-template/data/flutter_assets/assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          foreach ($a in 'icon.ico','icon.png','logo.png','logo_light.png','logo_dark.png') {
            Set-Content -Path "$assets/$a" -Value 'placeholder' -NoNewline
          }
          pushd ./res/msi
          python preprocess.py --arp --template --revision-version 0 -d ../../rustdesk-msi-template --app-name RDAPPNAM
          $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=$msiPlatform
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir ./msi-template
          mv $msi.FullName ./msi-template/rustdesk-template-${{ matrix.job.arch }}.msi
          git checkout -- res/msi
          rm -r -fo ./rustdesk-msi-template

      - name: Upload unsigned msi template
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-msi-template-${{ matrix.job.arch }}
          path: ./msi-template

      - name: Sign rustdesk self-extracted file
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

      - name: Upload signed Windows Flutter EXE
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-flutter-${{ matrix.job.arch }}-exe
          path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
          if-no-files-found: error

      - name: Upload signed Windows Flutter MSI
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-flutter-${{ matrix.job.arch }}-msi
          path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true'
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/rustdesk-*.msi
            ./SignOutput/rustdesk-*.exe

  # The fallback for the flutter version, we use Sciter for 32bit Windows.
